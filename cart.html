<!-- JSON-LD Structured Data : Shopping Cart -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ShoppingCart",
  "name": "Keranjang Belanja AlamGlow",
  "description": "Keranjang belanja berisi produk skincare alami pilihan pelanggan AlamGlow.",
  "provider": {
    "@type": "Organization",
    "name": "AlamGlow"
  }
}
</script>

<script>
function loadCart(){
  const cart = JSON.parse(localStorage.getItem("cartData")) || [];
  const table = document.getElementById("cartTable");
  const totalEl = document.getElementById("totalHarga");
  let total = 0;

  if(cart.length === 0){
    table.innerHTML = "<tr><td colspan='5'>Keranjang masih kosong.</td></tr>";
    totalEl.textContent = "Total: Rp 0";
    updateCartCount();
    return;
  }

  table.innerHTML = "<tr><th>Produk</th><th>Harga</th><th>Jumlah</th><th>Subtotal</th><th>Aksi</th></tr>";
  cart.forEach((item,i)=>{
    const sub = item.harga * item.jumlah;
    total += sub;
    table.innerHTML += `
      <tr>
        <td>${item.nama}</td>
        <td>Rp ${item.harga.toLocaleString('id-ID')}</td>
        <td>${item.jumlah}</td>
        <td>Rp ${sub.toLocaleString('id-ID')}</td>
        <td><button onclick="hapus(${i})">Hapus</button></td>
      </tr>`;
  });
  totalEl.textContent = "Total: Rp " + total.toLocaleString('id-ID');
  updateCartCount();
}

function hapus(i){
  const cart = JSON.parse(localStorage.getItem("cartData")) || [];
  cart.splice(i,1);
  localStorage.setItem("cartData", JSON.stringify(cart));
  loadCart();
}

function updateCartCount(){
  const cart = JSON.parse(localStorage.getItem("cartData")) || [];
  const total = cart.reduce((sum, item) => sum + item.jumlah, 0);
  document.getElementById("cart-count").textContent = total;
}

window.onload = function(){
  loadCart();
  updateCartCount();
};
</script>
